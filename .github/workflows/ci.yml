name: SOURCERUNE CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      validation_level:
        description: "CI level: fast / deep / release"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - deep
          - release

concurrency:
  group: sourcerune-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: JavaScript syntax
        run: node --check Web/App/app.js

      - name: Shared DSP compile and bounded native smoke
        run: |
          set -euo pipefail
          node --check Web/App/eq_graph.js
          g++ -std=c++20 -O2 -ffp-contract=off -Wall -Wextra -Werror Source/DSP/SceneProcessor.cpp Tests/Audio/native_smoke.cpp -o /tmp/sourcerune-native-eq
          /tmp/sourcerune-native-eq

      - name: JSON and preset mirror smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path(".").rglob("*.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print("JSON OK:", p)
          canonical = Path("Assets/FactoryPresets/scene_presets_v1.json").read_bytes()
          web = Path("Web/App/data/scene_presets_v1.json").read_bytes()
          assert canonical == web, "Factory preset Web mirror is stale"
          data = json.loads(canonical)
          assert data["count"] == len(data["presets"])
          assert len(set(data["presets"])) == len(data["presets"])
          for key, preset in data["presets"].items():
              assert preset["heroId"] == key, key
          print("FAST preset/data smoke: PASS")
          PY

      - name: UI asset parity smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          ui = Path("Assets/UI")

          with (ui / "asset_manifest_v2.csv").open(encoding="utf-8", newline="") as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 224, f"semantic manifest row count: {len(rows)}"
          assert all(r["status"] == "art-approved-v2" for r in rows), "non-approved semantic manifest row"

          expected_semantic = set()
          for row in rows:
              for key in ("ui01_asset", "ui02_asset", "master_asset"):
                  rel = row[key].replace("\\", "/")
                  assert (ui / rel).is_file(), f"missing semantic asset: {rel}"
                  expected_semantic.add(rel)

          # Formal approved *full REF* PNGs are review-only and must never
          # be counted as semantic runtime artwork. Keep the whitelist exact;
          # any unknown PNG still fails the strict semantic manifest equality.
          full_ref_only = {
              "UI_01/UI_01_REF/UI_01_REF_ORIGINAL_1508x808.png",
              "UI_01/UI_01_REF/UI_01_REF_2_5X_PIXEL.png",
              "UI_02/UI_02_REF/UI_02_REF.png",
              "UI_02/UI_02_REF/UI_02_REF_2_5X_PIXEL.png",
              "UI_02/UI_02_REF/UI_02_REF_SCAN_OVERLAY_1X.png",
          }
          actual_full_refs = set()
          actual_semantic = set()
          for surface in ("Shared", "UI_01", "UI_02"):
              base = ui / surface
              for p in base.rglob("*.png"):
                  rel = str(p.relative_to(ui)).replace("\\", "/")
                  if rel in full_ref_only:
                      with p.open("rb") as fh:
                          assert fh.read(8) == bytes.fromhex("89504e470d0a1a0a"), (
                              f"invalid PNG signature for full REF: {rel}"
                          )
                      actual_full_refs.add(rel)
                  else:
                      actual_semantic.add(rel)
          assert expected_semantic == actual_semantic, (
              f"semantic manifest mismatch missing={sorted(expected_semantic-actual_semantic)[:5]} "
              f"extra={sorted(actual_semantic-expected_semantic)[:5]}"
          )

          catalog = json.loads(Path("Web/App/data/catalog.json").read_text(encoding="utf-8"))
          assert catalog["count"] == len(catalog["items"]), "catalog count/items mismatch"
          baseline_ids = {r["id"] for r in rows}
          expansion = json.loads((ui / "scene_hero_049_074_manifest_v1.json").read_text(encoding="utf-8"))
          expansion_ids = {s["id"] for s in expansion["scenes"]}
          assert len(expansion_ids) == 26, f"scene expansion IDs: {len(expansion_ids)}"
          catalog_ids = {item["id"] for item in catalog["items"]}
          assert catalog_ids == baseline_ids | expansion_ids, (
              f"catalog ID mismatch missing={sorted((baseline_ids|expansion_ids)-catalog_ids)[:5]} "
              f"extra={sorted(catalog_ids-(baseline_ids|expansion_ids))[:5]}"
          )
          for item in catalog["items"]:
              if item["id"] in expansion_ids:
                  assert "art-required" in item.get("status", ""), f"expansion art status: {item['id']}"

          catalog_by_id = {item["id"]: item for item in catalog["items"]}
          for row in rows:
              item = catalog_by_id[row["id"]]
              for manifest_key, catalog_key in (
                  ("type", "type"),
                  ("name", "name"),
                  ("ui01_asset", "ui01"),
                  ("ui02_asset", "ui02"),
                  ("master_asset", "master"),
                  ("status", "status"),
              ):
                  assert item[catalog_key] == row[manifest_key], (
                      f"catalog/manifest mismatch {row['id']} {catalog_key}: "
                      f"{item[catalog_key]!r} != {row[manifest_key]!r}"
                  )

          scene_catalog_ids = {item["id"] for item in catalog["items"] if item["type"] == "SCENE_PRESET_HERO"}
          preset_data = json.loads(Path("Assets/FactoryPresets/scene_presets_v1.json").read_text(encoding="utf-8"))
          assert set(preset_data["presets"]) == scene_catalog_ids, "scene preset/catalog ID mismatch"
          for hero_id, preset in preset_data["presets"].items():
              for selection_type, asset_id in preset.get("selection", {}).items():
                  assert asset_id in catalog_by_id, f"{hero_id}: missing selection asset {asset_id}"
                  assert catalog_by_id[asset_id]["type"] == selection_type, (
                      f"{hero_id}: {asset_id} type {catalog_by_id[asset_id]['type']} != {selection_type}"
                  )

          runtime_root = ui / "Runtime"
          expected_runtime = set()
          for manifest_name in (
              "p0_skin_manifest_v1.json",
              "p1_skin_manifest_v1.json",
              "p2_skin_manifest_v1.json",
          ):
              data = json.loads((runtime_root / manifest_name).read_text(encoding="utf-8"))
              files = data.get("files", [])
              assert data["pngCount"] == len(files), f"{manifest_name}: pngCount/files mismatch"
              for rel in files:
                  assert (runtime_root / rel).is_file(), f"{manifest_name}: missing {rel}"
              overlap = expected_runtime.intersection(files)
              assert not overlap, f"runtime asset listed in multiple manifests: {sorted(overlap)[:5]}"
              expected_runtime.update(files)

          actual_runtime = {
              str(p.relative_to(runtime_root)).replace("\\", "/")
              for p in runtime_root.rglob("*.png")
          }
          assert expected_runtime == actual_runtime, (
              f"runtime manifest mismatch missing={sorted(expected_runtime-actual_runtime)[:5]} "
              f"extra={sorted(actual_runtime-expected_runtime)[:5]}"
          )

          refs = list((ui / "ReferenceSheets").glob("*.png"))
          integrity = json.loads((ui / "asset_integrity_v3.json").read_text(encoding="utf-8"))
          assert integrity["legacy"]["presentSemanticRuntime"] == len(actual_semantic)
          assert integrity["legacy"]["missing"] == 0
          assert integrity["current"]["runtimeChrome"] == len(actual_runtime)
          assert integrity["current"]["legacySemanticAndReference"] == len(actual_semantic) + len(refs)
          assert integrity["current"]["totalPng"] == len(actual_semantic) + len(actual_runtime) + len(refs)

          print(
              "FAST UI asset parity: PASS",
              f"semantic={len(actual_semantic)} runtime={len(actual_runtime)} refs={len(refs)}",
          )
          PY

      - name: Required structure
        shell: bash
        run: |
          set -euo pipefail
          test -s Source/State/ParameterIds.h
          test -s Web/App/index.html
          test -s Web/TestHarness/index.html
          test -s docs/architecture/DSP_BEHAVIOR_CONTRACT_V1.md
          test -s PROJECT_RULES.md

      - name: CI policy guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Fast / Deep / Release" PROJECT_RULES.md
          ! grep -Eq -- '--rounds[ =]+[0-9]+|--iterations[ =]+[0-9]+|for i in \{1\.\.[0-9]+' .github/workflows/ci.yml

  deep:
    name: Deep
    needs: fast
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_level == 'deep' || inputs.validation_level == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Default deep consistency
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          preset = json.loads(Path("Assets/FactoryPresets/scene_presets_v1.json").read_text(encoding="utf-8"))
          controls = json.loads(Path("Web/App/data/ui_controls.json").read_text(encoding="utf-8"))
          ids = re.findall(r'Entry\{"([^"]+)",\s*"([^"]+)"\}', Path("Source/State/ParameterIds.h").read_text(encoding="utf-8"))
          assert len(ids) == len({x[0] for x in ids}), "duplicate public parameter ID"
          assert preset["reserveCount"] >= 0
          assert sum(preset["portfolio"]["actualCounts"].values()) == sum(preset["portfolio"]["coreCounts"].values())
          assert controls["schema"] == 1
          print("DEEP consistency: PASS")
          PY

  release:
    name: Release
    needs: deep
    if: github.event_name == 'workflow_dispatch' && inputs.validation_level == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Release-readiness manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCERUNE release-readiness manifest"
            echo "commit=${GITHUB_SHA}"
            echo
            echo "NOTE: native VST3/WASM build targets are not yet present; this is repository readiness only."
            sha256sum               Assets/FactoryPresets/scene_presets_v1.json               Web/App/data/scene_presets_v1.json               Web/App/data/catalog.json               Web/App/data/ui_controls.json               Source/State/ParameterIds.h
          } > release-readiness.txt

      - name: Upload release-readiness manifest
        uses: actions/upload-artifact@v6
        with:
          name: sourcerune-release-readiness
          path: release-readiness.txt
          if-no-files-found: error
