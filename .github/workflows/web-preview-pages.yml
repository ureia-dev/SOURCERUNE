name: SOURCERUNE Web Preview
# Pages enabled; static preview deployment trigger
# deploy-trigger-v2

on:
  push:
    branches: [ "main" ]
    paths:
      - "Web/App/**"
      - "Assets/UI/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sourcerune-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render UI reference audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p Web/App/preview/rendered
          rm -f Web/App/preview/rendered/render-log.txt
          (
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sourcerune-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/ >/dev/null; then break; fi
            sleep 1
          done

          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi

          npm install --silent --no-save --prefix /tmp/sourcerune-ui-audit puppeteer-core@24
          NODE_PATH=/tmp/sourcerune-ui-audit/node_modules CHROME_PATH="$CHROME_PATH" node <<'NODE'
          const fs = require("fs");
          const puppeteer = require("puppeteer-core");

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ["--no-sandbox", "--disable-dev-shm-usage"]
            });
            const targets = [
              ["UI_01", 1499, 807],
              ["UI_02", 1672, 941]
            ];
            const results = {};
            for (const [ui, width, height] of targets) {
              const page = await browser.newPage();
              page.on("pageerror", err => console.error(`[${ui}] JavaScript error: ${err.stack || err.message}`));
              page.on("console", msg => {
                if (msg.type() === "error") console.error(`[${ui}] Browser console: ${msg.text()}`);
              });
              page.on("response", response => {
                if (response.status() >= 400 && /\/Web\/App\/(?:data\/|.*\.js)/.test(response.url()))
                  console.error(`[${ui}] HTTP ${response.status()}: ${response.url()}`);
              });
              await page.setViewport({ width, height, deviceScaleFactor: 1 });
              await page.goto(`http://127.0.0.1:4173/Web/App/?ui=${ui}`, { waitUntil: "networkidle0", timeout: 30000 });
              try {
                await page.waitForFunction(() => !!window.__geometryAudit, { timeout: 15000 });
              } catch (err) {
                const diagnostic = await page.evaluate(() => ({
                  readyState: document.readyState,
                  buildLabel: document.querySelector("#buildLabel")?.textContent || null,
                  geometryFunction: typeof window.auditReferenceGeometry,
                  geometryResult: typeof window.__geometryAudit,
                  appScripts: [...document.scripts].map(s => s.src)
                })).catch(e => ({ evaluationError: String(e) }));
                console.error(`[${ui}] Geometry audit timeout diagnostics: ${JSON.stringify(diagnostic)}`);
                throw err;
              }
              results[ui] = await page.evaluate(() => window.__geometryAudit);
              // One-shot UI_01 P0 smoke: real DOM click -> shared parameter -> Advanced -> Undo/Redo.
              // Existing Web Preview only; not a new CI/stress/safety test tier.
              if (ui === "UI_01") {
                const smoke = await page.evaluate(() => {
                  const ids = ["noiseStatic","dropout","interference","bitrateArtifacts"];
                  const get = id => document.querySelector(`[data-signal-checkbox="${id}"]`);
                  const panel = document.querySelector(".macro-badsignal")?.getBoundingClientRect();
                  const allVisible = !!panel && ids.every(id => {
                    const e=get(id),rect=e?.getBoundingClientRect();
                    return !!rect && rect.width>0 && rect.height>0 && rect.left>=panel.left && rect.right<=panel.right && rect.top>=panel.top && rect.bottom<=panel.bottom;
                  });
                  if (!allVisible) return {ok:false,allVisible,missing:ids.filter(id=>!get(id))};
                  const controls = {};
                  for (const id of ids) {
                    const initialChecked = get(id).checked;
                    get(id).click();
                    const toggled = get(id)?.checked === !initialChecked;
                    document.querySelector(".macro-badsignal h3")?.click();
                    const advanced = document.querySelector(`[data-param="${id}"]`);
                    const amount = advanced ? Number(advanced.value) : NaN;
                    const advancedSynced = Number.isFinite(amount) && (initialChecked ? amount===0 : amount>0);
                    document.querySelector("#advancedCloseBtn")?.click();
                    document.querySelector("#undoBtn")?.click();
                    const undoRestored = get(id)?.checked === initialChecked;
                    document.querySelector("#redoBtn")?.click();
                    const redoToggled = get(id)?.checked === !initialChecked;
                    document.querySelector("#undoBtn")?.click();
                    const backToBaseline = get(id)?.checked === initialChecked;
                    controls[id] = {initialChecked,toggled,advancedSynced,undoRestored,redoToggled,backToBaseline,ok:toggled&&advancedSynced&&undoRestored&&redoToggled&&backToBaseline};
                  }
                  return {ok:allVisible&&ids.every(id=>controls[id].ok),allVisible,controls};
                });
                results[ui].interactionSmoke = {"U01-12":smoke};
                if (!smoke.ok) throw new Error(`[UI_01] BAD SIGNAL checkbox smoke failed: ${JSON.stringify(smoke)}`);
              }
              await page.screenshot({
                path: `Web/App/preview/rendered/${ui}.png`,
                fullPage: false
              });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync(
              "Web/App/preview/rendered/geometry-report.json",
              JSON.stringify({ commit: process.env.GITHUB_SHA || null, results }, null, 2)
            );
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          ) >Web/App/preview/rendered/render-log.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "render audit failed with status $STATUS" >>Web/App/preview/rendered/render-log.txt
          else
            echo "render audit completed successfully" >>Web/App/preview/rendered/render-log.txt
          fi
          exit 0

      - name: Prepare static preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/Web _site/Assets
          cp -a Web/App _site/Web/App
          cp -a Assets/UI _site/Assets/UI
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("_site/Web/App/index.html")
          s = p.read_text(encoding="utf-8")
          rev = os.environ.get("GITHUB_SHA", "dev")[:12]
          s = re.sub(r'href="(\./[^"]+\.css)"', lambda m: f'href="{m.group(1)}?v={rev}"', s)
          s = re.sub(r'src="(\./[^"]+\.js)"', lambda m: f'src="{m.group(1)}?v={rev}"', s)
          p.write_text(s, encoding="utf-8")
          PY
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <title>SOURCERUNE Preview</title>
          <script>location.replace("./Web/App/" + location.search + location.hash)</script>
          <a href="./Web/App/">Open SOURCERUNE Web Preview</a>
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish current render audit to repo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during render; skip stale audit commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Web/App/preview/rendered
          if git diff --cached --quiet; then
            echo "render audit unchanged"
            exit 0
          fi
          git commit -m "chore: update UI render audit [skip ci]"
          git push origin HEAD:main
