name: SOURCERUNE Web Preview
# Pages enabled; static preview deployment trigger
# deploy-trigger-v2

on:
  push:
    branches: [ "main" ]
    paths:
      - "Web/App/**"
      - "Assets/UI/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sourcerune-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare static preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/Web _site/Assets
          cp -a Web/App _site/Web/App
          cp -a Assets/UI _site/Assets/UI
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("_site/Web/App/index.html")
          s = p.read_text(encoding="utf-8")
          rev = os.environ.get("GITHUB_SHA", "dev")[:12]
          s = re.sub(r'href="(\./[^"]+\.css)"', lambda m: f'href="{m.group(1)}?v={rev}"', s)
          s = re.sub(r'src="(\./app\.js)"', lambda m: f'src="{m.group(1)}?v={rev}"', s)
          p.write_text(s, encoding="utf-8")
          PY
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <title>SOURCERUNE Preview</title>
          <script>location.replace("./Web/App/" + location.search + location.hash)</script>
          <a href="./Web/App/">Open SOURCERUNE Web Preview</a>
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
