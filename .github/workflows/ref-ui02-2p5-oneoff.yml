name: SOURCERUNE UI02 2.5x REF materialization (one-off, not CI)
on:
  push:
    branches:
      - "ref/ui02-2p5-source-scan-20261009"
    paths:
      - ".github/workflows/ref-ui02-2p5-oneoff.yml"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
      - name: Setup pinned Pillow
        run: |
          python3 -m venv /tmp/ui02ref
          /tmp/ui02ref/bin/pip install --quiet pillow==12.3.0
      - name: Generate source-verified PNGs
        run: /tmp/ui02ref/bin/python tools/ref_scan/materialize_ui02_2p5.py
      - name: Commit images then remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/UI/UI_02/UI_02_REF/UI_02_REF_2_5X_PIXEL.png Assets/UI/UI_02/UI_02_REF/UI_02_REF_SCAN_OVERLAY_1X.png
          git rm -- .github/workflows/ref-ui02-2p5-oneoff.yml
          git commit -m "chore(ref ui02): check in verified 2.5x images [skip ci]"
          git push origin HEAD:refs/heads/ref/ui02-2p5-source-scan-20261009
