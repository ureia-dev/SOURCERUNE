name: UI_01 REF Finishing Candidate Preview
on:
  pull_request:
    branches: [main]
    paths:
      - "Web/App/index.html"
      - "Web/App/ui01_condition_ref_finish_v1.css"
      - "Web/App/ui01_eq_frame_ref_finish_v1.css"
      - "Web/App/ui01_knob_optics_ref_finish_v1.css"
      - ".github/workflows/ui01-ref-finish-pr116-preview.yml"

permissions:
  contents: write

concurrency:
  group: sr-ui01-ref-finish-pr116
  cancel-in-progress: true

jobs:
  real_browser_preview:
    if: github.event.pull_request.number == 116 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: One existing-tier Chromium UI_01 + UI_02 review
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sr-ref-finish-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/ >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-ref-finish-puppeteer puppeteer-core@24
          NODE_PATH=/tmp/sr-ref-finish-puppeteer/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const puppeteer=require("puppeteer-core"), fs=require("fs"), crypto=require("crypto");
          const {auditKnobs}=require("./Tests/Web/knob_smoke.cjs");
          const imagePath="Web/App/preview/rendered/UI_01_REF_FINISH_PR116.png";
          const reportPath="Web/App/preview/rendered/UI_01_REF_FINISH_PR116_report.json";
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              const result={sourceSha:process.env.SOURCE_SHA,checks:{}};
              for(const [ui,width,height] of [["UI_01",1499,807],["UI_02",1672,941]]){
                const page=await browser.newPage(),errors=[];
                page.on("pageerror",err=>errors.push(err.message));
                await page.setViewport({width,height,deviceScaleFactor:1});
                await page.goto("http://127.0.0.1:4173/Web/App/?ui="+ui,{waitUntil:"networkidle0",timeout:30000});
                await page.waitForFunction(()=>!!window.__geometryAudit,{timeout:15000});
                const geo=await page.evaluate(()=>window.__geometryAudit);
                if(!geo.ok||errors.length)throw Error(ui+" JS / geometry failure "+JSON.stringify({errors,failures:geo.failures}));
                const smoke=await auditKnobs(page,ui);
                if(!smoke.ok)throw Error(ui+" original knob smoke failed "+JSON.stringify(smoke));
                result.checks[ui]={geometry:true,knobSmoke:true};
                if(ui==="UI_01"){
                  const s=await page.evaluate(()=>{
                    const condition=document.querySelector(".macro-condition");
                    const input=condition.querySelector('[data-condition-checkbox="rattle"]');
                    const uiPanel=condition.getBoundingClientRect();
                    const cb=input.getBoundingClientRect();
                    const ring=document.querySelector(".macro-condition .macro-knob-face");
                    const eq=document.querySelector(".macro-eq");
                    const svg=eq.querySelector(".macro-eq-svg");
                    const power=eq.querySelector("[data-eq-power]");
                    const zoom=eq.querySelector("[data-eq-zoom-in]");
                    const value=document.querySelector(".macro-condition .macro-knob-value");
                    const knobFace=document.querySelector(".macro-condition .macro-knob-face");
                    const pointer=getComputedStyle(knobFace,"::after");
                    return {
                      boxSafe:cb.left>=uiPanel.left&&cb.right<=uiPanel.right&&cb.top>=uiPanel.top&&cb.bottom<=uiPanel.bottom,
                      offPng:getComputedStyle(input).backgroundImage,
                      zoomPng:getComputedStyle(zoom).backgroundImage,
                      activePower:power.classList.contains("active"),
                      powerPng:getComputedStyle(power).backgroundImage,
                      knobPng:getComputedStyle(ring).backgroundImage,
                      knobNeedle:{width:pointer.width,opacity:getComputedStyle(knobFace).opacity},
                      realValue:value.textContent,
                      eqNodes:svg.querySelectorAll("[data-eq-node]").length,
                      selected:document.querySelectorAll(".macro-intelligibility .macro-mode-row button.active").length
                    };
                  });
                  if(!s.boxSafe||!s.offPng.includes("RT_CHECKBOX_OFF.png")&&!s.offPng.includes("RT_CHECKBOX_ON.png")||
                     !s.zoomPng.includes("RT_BUTTON_CAP_IDLE.png")||
                     !s.powerPng.includes(s.activePower?"RT_SEGMENT_CAP_ACTIVE.png":"RT_SEGMENT_CAP_IDLE.png")||
                     !s.knobPng.includes("RT_KNOB_M_BASE.png")||s.knobNeedle.width!=="1.5px"||
                     s.eqNodes!==5||s.selected!==1)throw Error("Approved REF visual materials or active real controls missing: "+JSON.stringify(s));
                  result.checks[ui].visual=s;
                  await page.screenshot({path:imagePath,fullPage:false});
                  result.imageSha256=crypto.createHash("sha256").update(fs.readFileSync(imagePath)).digest("hex");
                  // Existing controls: verify real change + original one-step Undo.
                  const before=await page.$eval('[data-condition-checkbox="rattle"]',el=>el.checked);
                  await page.click('[data-condition-checkbox="rattle"]');
                  if((await page.$eval('[data-condition-checkbox="rattle"]',el=>el.checked))===before)
                    throw Error("Real Condition checkbox did not toggle");
                  await page.click("#undoBtn");
                  if((await page.$eval('[data-condition-checkbox="rattle"]',el=>el.checked))!==before)
                    throw Error("Real Condition Undo did not restore");
                  const oldPower=await page.$eval("[data-eq-power]",el=>el.getAttribute("aria-pressed"));
                  await page.click("[data-eq-power]");
                  if((await page.$eval("[data-eq-power]",el=>el.getAttribute("aria-pressed")))===oldPower)
                    throw Error("EQ bypass did not toggle");
                  await page.click("#undoBtn");
                  if((await page.$eval("[data-eq-power]",el=>el.getAttribute("aria-pressed")))!==oldPower)
                    throw Error("EQ bypass Undo did not restore");
                  result.checks[ui].stateUndo=true;
                }
                await page.close();
              }
              fs.writeFileSync(reportPath,JSON.stringify(result,null,2)+"\n");
              console.log("REAL UI01 FINISH PASS "+JSON.stringify({source:result.sourceSha,image:result.imageSha256,checks:Object.keys(result.checks)}));
            }finally{await browser.close()}
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1});
          NODE
      - name: Save single real review image to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/App/preview/rendered/UI_01_REF_FINISH_PR116.png Web/App/preview/rendered/UI_01_REF_FINISH_PR116_report.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(preview): retain actual UI01 REF candidate image and report [skip ci]"
            git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
          fi
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcerune-ui01-ref-finish-pr116
          path: |
            Web/App/preview/rendered/UI_01_REF_FINISH_PR116.png
            Web/App/preview/rendered/UI_01_REF_FINISH_PR116_report.json
          retention-days: 7
