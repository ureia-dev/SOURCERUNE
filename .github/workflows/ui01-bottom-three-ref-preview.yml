name: UI_01 Bottom Three REF Preview

on:
  pull_request:
    branches: [feat/ui01-meter-ref-pr114]
    paths:
      - "Web/App/app.js"
      - "Web/App/index.html"
      - "Web/App/ui01_bottom_ref.js"
      - "Web/App/ui01_bottom_ref_v1.css"
      - ".github/workflows/ui01-bottom-three-ref-preview.yml"

permissions:
  contents: write

concurrency:
  group: sr-ui01-three-ref-pr115
  cancel-in-progress: true

jobs:
  bottom_ref_review:
    if: github.event.pull_request.number == 115 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render real Web UI and exercise the three small controls
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sr-three-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/ >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-three-chrome puppeteer-core@24
          NODE_PATH=/tmp/sr-three-chrome/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const puppeteer=require("puppeteer-core"),fs=require("fs"),crypto=require("crypto");
          const screenshot="Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115.png";
          const liveImage="Web/App/preview/rendered/UI_01_BOTTOM_THREE_LIVE_PR115.png";
          const reportPath="Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115_report.json";
          const sha=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              const page=await browser.newPage(),errors=[];
              page.on("pageerror",e=>errors.push(e.message));
              await page.setViewport({width:1499,height:845,deviceScaleFactor:1});
              await page.goto("http://127.0.0.1:4173/Web/App/?ui=UI_01",{waitUntil:"networkidle0",timeout:30000});
              await page.waitForFunction(()=>!!window.__geometryAudit&&document.querySelector(".sr-amb-wave-canvas"),{timeout:15000});
              const initial=await page.evaluate(()=>{
                const box=n=>{const r=n.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
                const within=(a,b)=>a.left>=b.left-1&&a.right<=b.right+1&&a.top>=b.top-1&&a.bottom<=b.bottom+1;
                const amb=document.querySelector(".macro-ambience"),intel=document.querySelector(".macro-intelligibility"),mix=document.querySelector(".macro-mix");
                const refs=[...document.querySelectorAll(".sr-amb-ref-modes button,.sr-intel-ref-options input,.sr-mix-phase-pending")];
                const ck=document.querySelector("[data-ambience-duck]");
                const m=document.querySelector(".sr-mix-live-ratio");
                const nodes=[...document.querySelectorAll(".sr-amb-ref-modes,.sr-amb-ref-duck,.sr-amb-live-out")].map(x=>({ok:within(box(x),box(amb)),bounds:box(x)}))
                  .concat([...document.querySelectorAll(".sr-intel-ref-options")].map(x=>({ok:within(box(x),box(intel)),bounds:box(x)})))
                  .concat([m,document.querySelector(".sr-mix-phase-pending")].map(x=>({ok:within(box(x),box(mix)),bounds:box(x)})));
                const wave=document.querySelector(".sr-amb-wave-canvas"),css=getComputedStyle(wave);
                return {geometry:window.__geometryAudit.ok,geometryFailed:window.__geometryAudit.failures,
                  cards:[amb,intel,mix].map(box),nodes,disabled:refs.length,allDisabled:refs.every(x=>x.disabled),
                  duck:ck.checked,duckAmount:document.querySelector(".sr-amb-ref-duck output").textContent,
                  modes:document.querySelectorAll(".macro-intelligibility .macro-mode-row button").length,
                  selectedModes:document.querySelectorAll(".macro-intelligibility .macro-mode-row button.active").length,
                  ratio:m.textContent.trim(),waveCanvas:[wave.width,wave.height],waveVisible:css.display!=="none",
                  imgAssets:{ambDisabled:getComputedStyle(refs[0]).backgroundImage,
                    intelDisabled:getComputedStyle(refs[2]).backgroundImage,
                    mixDisabled:getComputedStyle(refs[4]).backgroundImage}};
              });
              if(errors.length||!initial.geometry)throw Error("Browser JS or locked geometry "+JSON.stringify({errors,initial}));
              if(initial.nodes.some(x=>!x.ok)||!initial.allDisabled||initial.disabled!==5||!initial.duck||
                initial.duckAmount!=="45%"||initial.modes!==3||initial.selectedModes!==1||
                !initial.ratio.includes("WET 100%")||!initial.ratio.includes("DRY 0%")||
                !initial.waveVisible||initial.waveCanvas[0]!==132)
                throw Error("REF bottom cards missing or clipped "+JSON.stringify(initial));
              if(!initial.imgAssets.ambDisabled.includes("RT_SEGMENT_CAP_DISABLED.png")||
                !initial.imgAssets.intelDisabled.includes("RT_CHECKBOX_DISABLED.png")||
                !initial.imgAssets.mixDisabled.includes("RT_BUTTON_CAP_DISABLED.png"))
                throw Error("Approved official disabled PNG state missing");
              await (await page.$(".app")).screenshot({path:screenshot});
              // Duck uses an EXISTING state ID and undo, never a fake DSP claim.
              await page.click(".sr-amb-ref-duck input");
              await page.waitForFunction(()=>document.querySelector(".sr-amb-ref-duck output")?.textContent==="0%");
              await page.$eval("#undoBtn",el=>el.click());
              await page.waitForFunction(()=>document.querySelector(".sr-amb-ref-duck output")?.textContent==="45%");
              // Intelligibility original mode controls remain live.
              await page.click('.macro-intelligibility [data-value="DIALOGUE"]');
              await page.waitForFunction(()=>document.querySelector('.macro-intelligibility [data-value="DIALOGUE"]')?.classList.contains("active"));
              await page.click('.macro-intelligibility [data-value="NATURAL"]');
              // Mix still responds to the existing keyed range, with no DSP change.
              await page.$eval('.macro-mix [data-macro="mix"]',el=>el.focus());
              await page.keyboard.press("ArrowDown");
              await page.waitForFunction(()=>document.querySelector(".sr-mix-live-ratio")?.textContent.includes("WET 99%"));
              await page.keyboard.press("ArrowUp");
              await page.waitForFunction(()=>document.querySelector(".sr-mix-live-ratio")?.textContent.includes("WET 100%"));
              // A real temporary WAV drives the existing AudioWorklet/outAn.
              await page.evaluate(()=>{
                const rate=48000,n=rate*3,bytes=new ArrayBuffer(44+n*2),dv=new DataView(bytes);
                const write=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i));};
                write(0,"RIFF");dv.setUint32(4,bytes.byteLength-8,true);write(8,"WAVE");
                write(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);
                dv.setUint16(22,1,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);
                dv.setUint16(32,2,true);dv.setUint16(34,16,true);write(36,"data");dv.setUint32(40,n*2,true);
                for(let i=0;i<n;i++)dv.setInt16(44+i*2,Math.round(.35*Math.sin(i*2*Math.PI*880/rate)*32767),true);
                const dt=new DataTransfer();dt.items.add(new File([bytes],"real-output-wave.wav",{type:"audio/wav"}));
                const input=document.querySelector("#audioFile");input.files=dt.files;input.dispatchEvent(new Event("change",{bubbles:true}));
              });
              await page.waitForFunction(()=>document.querySelector("#audioElement")?.readyState>=1,{timeout:20000});
              await page.click("#playBtn");
              await page.waitForFunction(()=>{const a=document.querySelector("#audioElement");return !a.paused&&a.currentTime>.25},{timeout:16000});
              const audio=await page.evaluate(()=>{
                const canvas=document.querySelector(".sr-amb-wave-canvas"),c=canvas.getContext("2d"),d=c.getImageData(0,0,canvas.width,canvas.height).data;
                let lit=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>0&&d[i+1]>90)lit++;
                return {lit,seconds:document.querySelector("#audioElement").currentTime,playing:!document.querySelector("#audioElement").paused};
              });
              if(!audio.playing||audio.lit<30)throw Error("No real audio waveform "+JSON.stringify(audio));
              await (await page.$(".app")).screenshot({path:liveImage});
              const result={sourceSha:process.env.SOURCE_SHA,initial,modeSmoke:"PASS",duckUndo:"PASS",mixKeyboard:"PASS",
                realOutputWave:audio,previewSha256:sha(screenshot),liveSha256:sha(liveImage),errors};
              fs.writeFileSync(reportPath,JSON.stringify(result,null,2)+"\n");
              console.log("TRUE REF THREE MODULES PASS "+JSON.stringify({sha:result.sourceSha,preview:result.previewSha256,live:audio}));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Store reviewed screenshot in stacked PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115.png Web/App/preview/rendered/UI_01_BOTTOM_THREE_LIVE_PR115.png Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115_report.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(preview): capture true UI_01 three-module PR115 assembly"
            git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
          fi
      - name: Upload one review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcerune-ui01-bottom-ref-pr115
          path: |
            Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115.png
            Web/App/preview/rendered/UI_01_BOTTOM_THREE_LIVE_PR115.png
            Web/App/preview/rendered/UI_01_BOTTOM_THREE_PR115_report.json
          retention-days: 7
