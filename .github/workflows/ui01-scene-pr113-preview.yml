name: UI_01 Scene PR113 Assembly Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "Web/App/**"
      - ".github/workflows/ui01-scene-pr113-preview.yml"

permissions:
  contents: write

concurrency:
  group: sr-scene-pr113-preview
  cancel-in-progress: true

jobs:
  scene_preview:
    if: github.event.pull_request.number == 113 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout real PR head (same-repo only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Assemble live Web UI in Chromium; render one screenshot
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p Web/App/preview/rendered
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sr-scene-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/ >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-scene-preview puppeteer-core@24
          NODE_PATH=/tmp/sr-scene-preview/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const fs=require("fs");
          const crypto=require("crypto");
          const puppeteer=require("puppeteer-core");
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:1499,height:885,deviceScaleFactor:1});
              const pageErrors=[];
              page.on("pageerror",e=>pageErrors.push(String(e.message)));
              await page.goto("http://127.0.0.1:4173/Web/App/?ui=UI_01",{waitUntil:"networkidle0",timeout:30000});
              await page.waitForFunction(()=>window.__geometryAudit && !!document.querySelector("#sceneSvg"),{timeout:15000});
              const result=await page.evaluate(async()=>{
                const app=document.querySelector(".app");
                const scene=document.querySelector(".scene-panel");
                const svg=document.querySelector("#sceneSvg");
                const waveform=document.querySelector("#sceneWaveformCanvas");
                const imgs=Array.from(document.querySelectorAll(".module-card img"));
                const paths=[
                  "/Assets/UI/Runtime/Common/Scene/RT_MOTION_CAR_GLYPH.png",
                  "/Assets/UI/Runtime/Common/Scene/RT_SCENE_SOURCE_MARKER_IDLE.png",
                  "/Assets/UI/Runtime/Common/Scene/RT_SCENE_LISTENER_MARKER_IDLE.png",
                  "/Assets/UI/Runtime/UI_01/Scene/RT_DISTANCE_CALLOUT.png",
                  "/Assets/UI/Runtime/UI_01/Scene/RT_WAVEFORM_STRIP_BG.png"
                ];
                const assets=await Promise.all(paths.map(async path=>{
                  const response=await fetch(path);const bytes=await response.arrayBuffer();
                  return {path,status:response.status,bytes:bytes.byteLength};
                }));
                return {ui:"UI_01",geometryOk:window.__geometryAudit.ok,geometryFailed:window.__geometryAudit.failures,app:{w:app.getBoundingClientRect().width,h:app.getBoundingClientRect().height},sceneHeight:scene.getBoundingClientRect().height,sceneSvgHeight:svg.getBoundingClientRect().height,waveformHeight:waveform.getBoundingClientRect().height,semanticArt:imgs.map(i=>({src:i.getAttribute("src"),naturalWidth:i.naturalWidth,loaded:i.complete&&i.naturalWidth>0})),assets};
              });
              if(pageErrors.length)throw Error("Page errors: "+JSON.stringify(pageErrors));
              if(!result.geometryOk)throw Error("Original geometry failed: "+JSON.stringify(result.geometryFailed));
              if(!result.semanticArt.some(i=>i.loaded&&i.naturalWidth>=100))throw Error("No substantial semantic artwork decoded");
              if(result.assets.some(x=>x.status!==200||x.bytes<100))throw Error("Missing real scene assets: "+JSON.stringify(result.assets));
              const dest="Web/App/preview/rendered/UI_01_PR113.png";
              await page.$eval(".app",el=>el.scrollIntoView({block:"nearest"}));
              await (await page.$(".app")).screenshot({path:dest});
              result.sha=process.env.SOURCE_SHA;
              result.screenshotSha256=crypto.createHash("sha256").update(fs.readFileSync(dest)).digest("hex");
              fs.writeFileSync("Web/App/preview/rendered/UI_01_PR113_report.json",JSON.stringify(result,null,2)+"\n");
              console.log("REAL CHROME SCENE PREVIEW PASS "+JSON.stringify(result));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - name: Persist review-only PR branch proof (never main)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/App/preview/rendered/UI_01_PR113.png Web/App/preview/rendered/UI_01_PR113_report.json
          if git diff --cached --quiet; then
            echo "No changed preview artifact"; exit 0
          fi
          git commit -m "docs(preview): capture real UI_01 PR113 Chromium assembly"
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
      - name: Upload inspectable screenshot (one pass, no DSP tests)
        uses: actions/upload-artifact@v4
        with:
          name: ui01-scene-pr113-real-browser
          path: |
            Web/App/preview/rendered/UI_01_PR113.png
            Web/App/preview/rendered/UI_01_PR113_report.json
          retention-days: 7
