name: UI_01 Scene PR113 Assembly Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "Web/App/**"
      - ".github/workflows/ui01-scene-pr113-preview.yml"

permissions:
  contents: write

concurrency:
  group: sr-scene-pr113-preview
  cancel-in-progress: true

jobs:
  scene_preview:
    if: github.event.pull_request.number == 113 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout real PR head (same-repo only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Assemble live Web UI in Chromium; render one screenshot
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p Web/App/preview/rendered
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sr-scene-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/ >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-scene-preview puppeteer-core@24
          NODE_PATH=/tmp/sr-scene-preview/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const fs=require("fs");
          const crypto=require("crypto");
          const puppeteer=require("puppeteer-core");
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:1499,height:885,deviceScaleFactor:1});
              const pageErrors=[];
              page.on("pageerror",e=>pageErrors.push(String(e.message)));
              await page.goto("http://127.0.0.1:4173/Web/App/?ui=UI_01",{waitUntil:"networkidle0",timeout:30000});
              await page.waitForFunction(()=>window.__geometryAudit && !!document.querySelector("#sceneSvg"),{timeout:15000});
              // Verify the displayed buttons really zoom and reset the live SVG.
              const initialBox=await page.$eval("#sceneSvg",n=>n.getAttribute("viewBox"));
              const initialCurve=await page.$eval("#motionPath",n=>n.getAttribute("d"));
              await page.click('[data-scene-zoom="in"]');
              await page.waitForFunction(()=>document.querySelector("#sceneZoomReadout")?.textContent==="125%",{timeout:5000});
              const enlargedBox=await page.$eval("#sceneSvg",n=>n.getAttribute("viewBox"));
              await page.click('[data-scene-zoom="reset"]');
              await page.waitForFunction(()=>document.querySelector("#sceneZoomReadout")?.textContent==="100%",{timeout:5000});
              const resetBox=await page.$eval("#sceneSvg",n=>n.getAttribute("viewBox"));
              const resetCurve=await page.$eval("#motionPath",n=>n.getAttribute("d"));
              if(initialBox!==resetBox||initialBox===enlargedBox)throw Error("Scene live zoom/reset did not update viewBox");
              if(initialCurve!==resetCurve)throw Error("Live distance curve drifted after zoom/reset");
              const timeCount=await page.evaluate(()=>document.querySelectorAll(".scene-time-ruler [data-scene-time]").length);
              if(timeCount!==5)throw Error("Scene time ruler has "+timeCount+" labels");
              const labelOverlap=await page.evaluate(()=>{
                const a=document.querySelector("#sourceLabel")?.getBoundingClientRect();
                const b=document.querySelector("#distanceCallout")?.getBoundingClientRect();
                if(!a||!b)return true;
                return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
              });
              if(labelOverlap)throw Error("SOURCE label still overlaps distance callout");
              const result=await page.evaluate(async()=>{
                const app=document.querySelector(".app");
                const scene=document.querySelector(".scene-panel");
                const svg=document.querySelector("#sceneSvg");
                const waveform=document.querySelector("#sceneWaveformCanvas");
                const imgs=Array.from(document.querySelectorAll(".module-card img"));
                const paths=[
                  "/Assets/UI/Runtime/Common/Scene/RT_MOTION_CAR_GLYPH.png",
                  "/Assets/UI/Runtime/Common/Scene/RT_SCENE_SOURCE_MARKER_IDLE.png",
                  "/Assets/UI/Runtime/Common/Scene/RT_SCENE_LISTENER_MARKER_IDLE.png",
                  "/Assets/UI/Runtime/UI_01/Scene/RT_DISTANCE_CALLOUT.png",
                  "/Assets/UI/Runtime/UI_01/Scene/RT_WAVEFORM_STRIP_BG.png"
                ];
                const assets=await Promise.all(paths.map(async path=>{
                  const response=await fetch(path);const bytes=await response.arrayBuffer();
                  return {path,status:response.status,bytes:bytes.byteLength};
                }));
                return {ui:"UI_01",sceneBrightness:getComputedStyle(scene).filter,geometryOk:window.__geometryAudit.ok,geometryFailed:window.__geometryAudit.failures,app:{w:app.getBoundingClientRect().width,h:app.getBoundingClientRect().height},sceneHeight:scene.getBoundingClientRect().height,sceneSvgHeight:svg.getBoundingClientRect().height,waveformHeight:waveform.getBoundingClientRect().height,semanticArt:imgs.map(i=>({src:i.getAttribute("src"),naturalWidth:i.naturalWidth,loaded:i.complete&&i.naturalWidth>0})),assets};
              });
              if(result.sceneBrightness!=="brightness(2)")throw Error("Expected UI_01 Scene exactly 2x brighter; got "+result.sceneBrightness);
              const material=await page.evaluate(()=>{
                const wave=document.querySelector(".scene-waveform-strip");
                const buttons=Array.from(document.querySelectorAll(".macro-motion .macro-mode-row button"));
                const bounds=n=>{const r=n.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}};
                return {waveImage:getComputedStyle(wave).borderImageSource,
                  waveBounds:bounds(wave),
                  buttons:buttons.map(n=>({value:n.dataset.value,active:n.classList.contains("active"),
                    image:getComputedStyle(n).backgroundImage,rect:bounds(n)})),
                  macroBottom:document.querySelector(".macro-motion").getBoundingClientRect().bottom,
                  curve:document.querySelector("#motionPath").getAttribute("d")};
              });
              if(!material.waveImage.includes("RT_WAVEFORM_STRIP_BG.png"))
                throw Error("Waveform approved PNG nine-slice missing");
              if(material.buttons.length!==3)throw Error("Expected three Motion mode buttons");
              if(material.buttons.some(x=>x.rect.h<35||x.rect.h>37||x.rect.y<690||x.rect.bottom>material.macroBottom-6))
                throw Error("REF Motion button dimensions/position failed: "+JSON.stringify(material.buttons));
              if(material.buttons.some(x=>!x.image.includes(x.active?"RT_SEGMENT_CAP_ACTIVE.png":"RT_SEGMENT_CAP_IDLE.png")))
                throw Error("Motion mode raster state incorrect: "+JSON.stringify(material.buttons));
              if(material.buttons.filter(x=>x.active).length!==1)throw Error("Expected exactly one active Motion mode");
              // Exercise actual Web analyser UI controls without inventing an audio signal.
              await page.click('[data-spectrum-source="PRE"]');
              if(!(await page.$eval('[data-spectrum-source="PRE"]',n=>n.classList.contains("active")&&n.getAttribute("aria-pressed")==="true")))
                throw Error("PRE analyser selection not active");
              await page.click('[data-spectrum-source="POST"]');
              await page.click("[data-spectrum-smoothing]");
              if((await page.$eval("[data-spectrum-smoothing]",n=>n.textContent))!=="RAW")
                throw Error("Smoothing button did not switch to RAW");
              await page.click("[data-spectrum-smoothing]");
              await page.click("[data-spectrum-rta]");
              if((await page.$eval("[data-spectrum-rta]",n=>n.getAttribute("aria-pressed")))!=="false")
                throw Error("RTA toggle failed");
              await page.click("[data-spectrum-rta]");
              const spectrumProof=await page.evaluate(()=>{
                const controls=document.querySelector(".analysis-rta-controls");
                const buttons=Array.from(controls.querySelectorAll("button"));
                const channel=controls.querySelector(".spectrum-channel-label");
                return {count:buttons.length,visible:getComputedStyle(controls).display!=="none",
                  pre:buttons[0].classList.contains("active"),post:buttons[1].classList.contains("active"),
                  rta:buttons[2].classList.contains("active"),smoothing:buttons[3].textContent,
                  channel:channel.textContent, channelTag:channel.tagName,
                  bounds:controls.getBoundingClientRect().toJSON(),
                  tabBounds:document.querySelector(".tabs").getBoundingClientRect().toJSON()};
              });
              if(spectrumProof.count!==4||!spectrumProof.visible||spectrumProof.pre||!spectrumProof.post||
                 !spectrumProof.rta||spectrumProof.smoothing!=="1/3"||spectrumProof.channel!=="L+R"||
                 spectrumProof.channelTag!=="SPAN"||
                 spectrumProof.bounds.right>spectrumProof.tabBounds.right+1)
                throw Error("REF spectrum control material/geometry mismatch: "+JSON.stringify(spectrumProof));
              if(pageErrors.length)throw Error("Page errors: "+JSON.stringify(pageErrors));
              if(!result.geometryOk)throw Error("Original geometry failed: "+JSON.stringify(result.geometryFailed));
              if(!result.semanticArt.some(i=>i.loaded&&i.naturalWidth>=100))throw Error("No substantial semantic artwork decoded");
              if(result.assets.some(x=>x.status!==200||x.bytes<100))throw Error("Missing real scene assets: "+JSON.stringify(result.assets));
              const dest="Web/App/preview/rendered/UI_01_PR113.png";
              await page.$eval(".app",el=>el.scrollIntoView({block:"nearest"}));
              await (await page.$(".app")).screenshot({path:dest});
              result.assembledMaterials=material;
              result.spectrumControls=spectrumProof;
              result.visualSmoke={zoomIn:true,zoomReset:true,timeRulerTicks:5,labelNoOverlap:!labelOverlap};
              result.sha=process.env.SOURCE_SHA;
              result.screenshotSha256=crypto.createHash("sha256").update(fs.readFileSync(dest)).digest("hex");
              fs.writeFileSync("Web/App/preview/rendered/UI_01_PR113_report.json",JSON.stringify(result,null,2)+"\n");
              console.log("REAL CHROME SCENE PREVIEW PASS "+JSON.stringify(result));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - name: Persist review-only PR branch proof (never main)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/App/preview/rendered/UI_01_PR113.png Web/App/preview/rendered/UI_01_PR113_report.json
          if git diff --cached --quiet; then
            echo "No changed preview artifact"; exit 0
          fi
          git commit -m "docs(preview): capture real UI_01 PR113 Chromium assembly"
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
      - name: Upload inspectable screenshot (one pass, no DSP tests)
        uses: actions/upload-artifact@v4
        with:
          name: ui01-scene-pr113-real-browser
          path: |
            Web/App/preview/rendered/UI_01_PR113.png
            Web/App/preview/rendered/UI_01_PR113_report.json
          retention-days: 7
